[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-limpeza"
version = "1.0.0"
description = "H.A - Limpeza: Property readiness and commercial asset management platform."
authors = [{ name = "MalanzaBizz Team", email = "ops@malanzabizz.com" }]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"
